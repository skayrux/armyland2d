name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: Тип сборки
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # загрузка кода репозитория
      - name: Checkout
        uses: actions/checkout@v4

      # установка jdk 21 для agp 9
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # настройка android sdk и лицензий
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # установка gradle 9.3.1 и кэширование
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # подготовка ключа подписи для debug или release
      - name: Prepare Keystore
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "Error: add RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD in GitHub Secrets."
              exit 1
            fi
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          else
            if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            fi
          fi

      # сборка apk
      - name: Build APK
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            gradle assembleRelease --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      # выгрузка готового apk в артефакты
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: armyland2d-${{ inputs.build_type || 'debug' }}-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
